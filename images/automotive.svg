<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EE5A52;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Car body -->
  <path d="M 15 60 L 22 40 L 35 35 L 65 35 L 78 40 L 85 60 Z" fill="url(#carGradient)" stroke="#333" stroke-width="1.5"/>
  
  <!-- Car cabin -->
  <path d="M 32 40 L 36 25 L 64 25 L 68 40" fill="#FF8787" stroke="#333" stroke-width="1.5"/>
  
  <!-- Front bumper -->
  <rect x="14" y="60" width="72" height="4" fill="#FFD93D" stroke="#333" stroke-width="1"/>
  
  <!-- Left wheel -->
  <circle cx="28" cy="70" r="10" fill="#333"/>
  <circle cx="28" cy="70" r="6" fill="#FFD93D" stroke="#333" stroke-width="1"/>
  
  <!-- Right wheel -->
  <circle cx="72" cy="70" r="10" fill="#333"/>
  <circle cx="72" cy="70" r="6" fill="#FFD93D" stroke="#333" stroke-width="1"/>
  
  <!-- Front window -->
  <path d="M 36 28 L 40 25 L 50 25 L 48 28" fill="#87CEEB" stroke="#333" stroke-width="1" opacity="0.7"/>
  
  <!-- Back window -->
  <path d="M 52 28 L 60 25 L 64 25 L 60 28" fill="#87CEEB" stroke="#333" stroke-width="1" opacity="0.7"/>
  
  <!-- Door line -->
  <line x1="50" y1="40" x2="50" y2="60" stroke="#333" stroke-width="1"/>
  
  <!-- Headlights -->
  <circle cx="18" cy="55" r="2.5" fill="#FFD93D"/>
  <circle cx="18" cy="55" r="1.5" fill="#FFF"/>
  
  <!-- Side mirror -->
  <rect x="12" y="50" width="2" height="5" fill="#333"/>
  <ellipse cx="13" cy="48" rx="2" ry="2" fill="#666"/>
</svg>